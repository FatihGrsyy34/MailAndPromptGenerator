[project]
name = "promptgenerator"
version = "0.1.0"
description = "Ctrl+Space ile çalışan mail ve prompt üretici (Gemini)"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "pywebview>=6.2,<7",
    "pystray==0.19.5",  # 2023'ten beri yeni sürüm yok: sabit tutuyoruz
    "Pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
