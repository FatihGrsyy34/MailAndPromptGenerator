# Prompt modu seçenekleri. task_types: ne hakkında; targets: hangi araca yapıştırılacak; details: ne kadar detaylı.

task_types:
  kod: {label: "Kod / Yazılım", template: kod}
  arastirma: {label: "Araştırma / Analiz", template: arastirma}
  yazi: {label: "Yazı / İçerik", template: yazi}
  gorsel: {label: "Görsel üretim", template: gorsel}
  veri: {label: "Veri analizi", template: veri}
  agent: {label: "Agent / System prompt", template: agent}
  genel: {label: "Genel", template: genel}

targets:
  claude:
    label: Claude
    format: |
      Target is Claude (Anthropic). Structure the prompt with XML tags for distinct parts, e.g. <context>, <task>,
      <constraints>, <output_format>, <examples> (only the ones needed). Put long reference material first and the
      actual request last. Write instructions as clear prose that explains the purpose behind important rules
      (Claude generalises from the reason). Say what to do rather than what not to do. State the desired length and
      scope explicitly. Do not add "think step by step" boilerplate or "double-check your work" lines.
  chatgpt:
    label: ChatGPT
    format: |
      Target is ChatGPT (OpenAI). Use short Markdown sections in this order as far as they apply: Role, Goal,
      Context, Success criteria, Constraints, Output format, and (for multi-step work) when to stop or ask. Describe
      the outcome rather than micromanaging each step. Use ALWAYS/NEVER only for true hard rules. Remove any
      contradictions; the model follows instructions literally.
  gemini:
    label: Gemini
    format: |
      Target is Gemini (Google). Put the role, hard constraints and output format at the top, then the context, then
      the specific request at the end. Use one consistent delimiter style (Markdown headings or XML tags, not both).
      Define any ambiguous terms. Be direct; avoid persuasive or emotional language.
  midjourney:
    label: Midjourney
    format: |
      Target is Midjourney (image). Output a single prompt line in English, 20-60 words: main subject first, then
      setting, composition, lighting, style/medium, colour palette, mood. Use concrete visual nouns and adjectives;
      no instructions like "please create". Append parameters at the end only when they follow from the request:
      --ar W:H for aspect ratio, --no for exclusions, --s for stylisation, --raw for photographic realism.
      Do not add a --v version parameter unless the user asked for a specific version (the default is current).
      Do not add filler quality tags ("high quality", "8k", "masterpiece", "professional photography") unless requested.
      For "detailed" levels you may add up to two alternative variants on separate lines.
  kodlama_ajani:
    label: Cursor / Claude Code
    format: |
      Target is a coding agent working inside a repository (Cursor, Claude Code, Codex). Structure: Goal (one or two
      sentences), Context (relevant files, paths, stack, existing patterns to follow), Requirements, Constraints and
      out-of-scope items, Acceptance criteria, and How to verify (commands or tests to run). Be explicit about scope so
      the agent does not over-engineer. Use Markdown headings and short bullets.
  genel:
    label: Genel (her model)
    format: |
      Target model unknown. Use clean Markdown sections (Role if useful, Task, Context, Constraints, Output format)
      that work well in any chat assistant. Plain, direct instructions.

details:
  kisa:
    label: Kısa
    budget: "Short: about 60-150 words. Only the essentials: task, key context, key constraints, output format. No examples."
  detayli:
    label: Detaylı
    budget: "Detailed: about 200-450 words. Full context, explicit constraints, clear output format, success criteria. One short example only if it removes real ambiguity."
  cok_detayli:
    label: Çok detaylı
    budget: "Very detailed: 450-1000 words. Everything in 'detailed' plus step-by-step approach where the task needs it, edge cases to handle, quality bar / success rubric, and 1-3 examples or output skeletons. Still no padding: every line must earn its place."
